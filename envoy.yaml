static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          stream_idle_timeout: 0s
          request_timeout: 0s
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              # 1. Trojan WebSocket Route
              - match:
                  prefix: "/trojan-xray-envoy"
                route:
                  cluster: xray_trojan
                  timeout: 0s
                  idle_timeout: 0s
                  upgrade_configs:
                  - upgrade_type: websocket

              # 2. VLESS WebSocket Route
              - match:
                  prefix: "/vless-xray-envoy"
                route:
                  cluster: xray_vless
                  timeout: 0s
                  idle_timeout: 0s
                  upgrade_configs:
                  - upgrade_type: websocket

              # 3. 🎭 WEB DECOY ROUTE (Catch-all for "/")
              - match:
                  prefix: "/"
                direct_response:
                  status: 200
                  body:
                    inline_string: "<!DOCTYPE html><html><head><title>Welcome</title></head><body style='font-family:sans-serif;text-align:center;padding:50px;'><h1>Server Active</h1><p>Welcome to our cloud application gateway. Everything is operational.</p></body></html>"
                response_headers_to_add:
                - header:
                    key: "content-type"
                    value: "text/html; charset=utf-8"
                  append: false

          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: xray_trojan
    connect_timeout: 10s
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: xray_trojan
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 10000

  - name: xray_vless
    connect_timeout: 10s
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: xray_vless
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 10001
